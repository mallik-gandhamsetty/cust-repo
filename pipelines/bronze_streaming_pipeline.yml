# Bronze Streaming Pipeline - Real-time Data Ingestion
# Kafka sources for POS transactions, customer events, and inventory movements
# Generated by Nexa Platform - DO NOT EDIT MANUALLY

metadata:
  name: "bronze_streaming_pipeline"
  description: "Real-time ingestion of streaming data from Kafka topics into Bronze layer"
  version: "1.0.0"
  layer: "bronze"
  pipeline_type: "streaming"
  created_by: "nexa_platform"
  business_owner: "data_platform_team"
  
# Pipeline Configuration for Databricks DLT
pipeline_config:
  name: "MegaMart Bronze Streaming Ingestion"
  catalog: "megamart_retail360_prod"
  target: "bronze_streaming"
  continuous: true
  development: false
  edition: "ADVANCED"
  photon: true
  serverless: false
  
  # Cluster configuration optimized for streaming workloads
  clusters:
    - label: "streaming_cluster"
      policy_id: "streaming_optimized_policy"
      autoscale:
        min_workers: 2
        max_workers: 8
        mode: "ENHANCED"
      node_type_id: "i3.xlarge"
      spark_version: "13.3.x-scala2.12"
      
      # Spark configuration for streaming optimization
      spark_conf:
        "spark.sql.streaming.metricsEnabled": "true"
        "spark.sql.streaming.stateStore.maintenanceInterval": "60s"
        "spark.sql.adaptive.enabled": "true"
        "spark.sql.adaptive.coalescePartitions.enabled": "true"
        "spark.databricks.delta.optimizeWrite.enabled": "true"
        "spark.databricks.delta.autoCompact.enabled": "true"
        "spark.sql.streaming.kafka.useDeprecatedOffsetFetching": "false"
        
      # Custom tags for cost tracking and governance
      custom_tags:
        project: "megamart_retail360"
        layer: "bronze"
        pipeline_type: "streaming"
        environment: "production"
        cost_center: "data_platform"
        
  # Global pipeline configuration
  configuration:
    # Streaming specific settings
    "pipelines.trigger.interval": "5 seconds"
    "pipelines.maxFilesPerTrigger": "1000"
    "pipelines.kafka.maxOffsetsPerTrigger": "10000"
    
    # Delta Lake optimizations
    "pipelines.enableChangeDataFeed": "true"
    "pipelines.autoOptimize.managed": "true"
    "pipelines.autoOptimize.zOrderCols": "transaction_timestamp,event_timestamp"
    
    # Error handling and recovery
    "pipelines.streaming.statefulOperatorCheckIntervalMs": "10000"
    "pipelines.streaming.failOnDataLoss": "false"
    
    # Kafka connection settings (will be overridden by environment-specific values)
    "kafka.bootstrap.servers": "kafka-cluster.megamart.internal:9092"
    "kafka.security.protocol": "SASL_SSL"
    "kafka.sasl.mechanism": "PLAIN"
    
  # Storage configuration
  storage: "s3://megamart-data-lake-prod/pipelines/bronze_streaming/"
  
  # Pipeline libraries - Python notebooks and SQL files
  libraries:
    - notebook:
        path: "/Workspace/megamart_retail360/transformations/bronze/kafka_pos_transactions"
    - notebook:
        path: "/Workspace/megamart_retail360/transformations/bronze/kafka_customer_events"  
    - notebook:
        path: "/Workspace/megamart_retail360/transformations/bronze/kafka_inventory_movements"
        
  # Pipeline permissions
  permissions:
    - user_name: "data-engineers@megamart.com"
      permission_level: "CAN_MANAGE"
    - user_name: "platform-admins@megamart.com"
      permission_level: "CAN_MANAGE"
    - service_principal_name: "megamart-bronze-streaming-sp"
      permission_level: "CAN_RUN"
      
  # Tags for organization and governance
  tags:
    environment: "production"
    layer: "bronze"
    pipeline_type: "streaming"
    data_domains: "sales,customer,inventory"
    business_critical: "true"

# Data Sources Configuration
data_sources:
  kafka_clusters:
    - name: "primary_kafka_cluster"
      bootstrap_servers: "kafka-cluster.megamart.internal:9092"
      security_protocol: "SASL_SSL"
      sasl_mechanism: "PLAIN"
      
      # Connection pool settings
      connections:
        max_idle_connections: 10
        max_connections: 50
        connection_timeout_ms: 30000
        session_timeout_ms: 30000
        
      # Topics configuration
      topics:
        - name: "pos-transactions-v1"
          partitions: 12
          replication_factor: 3
          retention_ms: 604800000  # 7 days
          target_table: "pos_transactions"
          
        - name: "customer-events-v1" 
          partitions: 8
          replication_factor: 3
          retention_ms: 259200000  # 3 days
          target_table: "customer_events"
          
        - name: "inventory-movements-v1"
          partitions: 6
          replication_factor: 3
          retention_ms: 604800000  # 7 days
          target_table: "inventory_movements"

# Target Tables Configuration
target_tables:
  - name: "pos_transactions"
    description: "Real-time POS transaction data from all stores"
    materialization: "STREAMING_TABLE"
    
    # Partitioning strategy
    partition_by: ["transaction_date"]
    cluster_by: ["store_id", "payment_method"]
    z_order_by: ["transaction_timestamp", "customer_id"]
    
    # Streaming configuration
    streaming:
      watermark:
        column: "transaction_timestamp"
        delay_threshold: "1 minute"
      checkpoint_location: "s3://megamart-data-lake-prod/checkpoints/pos_transactions/"
      
    # Data quality expectations
    expectations:
      - name: "valid_transaction_id"
        expression: "transaction_id IS NOT NULL AND LENGTH(transaction_id) >= 10"
        action: "FAIL"
        
      - name: "positive_amounts"
        expression: "total_amount > 0 AND subtotal > 0"
        action: "FAIL"
        
      - name: "valid_timestamp"
        expression: "transaction_timestamp IS NOT NULL"
        action: "FAIL"
        
      - name: "amounts_balance"
        expression: "ABS(total_amount - (subtotal + COALESCE(tax_amount, 0) - COALESCE(discount_amount, 0))) < 0.01"
        action: "QUARANTINE"
        
    # Table properties
    table_properties:
      "delta.enableChangeDataFeed": "true"
      "delta.autoOptimize.optimizeWrite": "true"
      "delta.autoOptimize.autoCompact": "true"
      "delta.deletedFileRetentionDuration": "interval 7 days"
      "delta.logRetentionDuration": "interval 30 days"
      
  - name: "customer_events"
    description: "Real-time customer interaction and behavior events"
    materialization: "STREAMING_TABLE"
    
    # Partitioning strategy
    partition_by: ["event_date", "channel"]
    cluster_by: ["customer_id", "event_type"]
    z_order_by: ["event_timestamp", "session_id"]
    
    # Streaming configuration
    streaming:
      watermark:
        column: "event_timestamp"
        delay_threshold: "30 seconds"
      checkpoint_location: "s3://megamart-data-lake-prod/checkpoints/customer_events/"
      
    # Data quality expectations
    expectations:
      - name: "valid_event_id"
        expression: "event_id IS NOT NULL AND LENGTH(event_id) >= 20"
        action: "FAIL"
        
      - name: "valid_customer_id"  
        expression: "customer_id IS NOT NULL AND LENGTH(customer_id) >= 10"
        action: "FAIL"
        
      - name: "valid_event_type"
        expression: "event_type IN ('page_view', 'product_view', 'add_to_cart', 'purchase', 'search', 'login', 'logout', 'registration')"
        action: "FAIL"
        
      - name: "recent_timestamp"
        expression: "event_timestamp > current_timestamp() - INTERVAL 1 DAY"
        action: "DROP"
        
    # Table properties
    table_properties:
      "delta.enableChangeDataFeed": "true"
      "delta.autoOptimize.optimizeWrite": "true"
      "delta.autoOptimize.autoCompact": "true"
      "delta.deletedFileRetentionDuration": "interval 7 days"
      
  - name: "inventory_movements"
    description: "Real-time inventory movement tracking"
    materialization: "STREAMING_TABLE"
    
    # Partitioning strategy
    partition_by: ["movement_date", "location_type"]
    cluster_by: ["location_id", "product_id"]
    z_order_by: ["movement_timestamp", "movement_type"]
    
    # Streaming configuration
    streaming:
      watermark:
        column: "movement_timestamp" 
        delay_threshold: "2 minutes"
      checkpoint_location: "s3://megamart-data-lake-prod/checkpoints/inventory_movements/"
      
    # Data quality expectations
    expectations:
      - name: "valid_movement_id"
        expression: "movement_id IS NOT NULL"
        action: "FAIL"
        
      - name: "valid_movement_type"
        expression: "movement_type IN ('RECEIPT', 'SALE', 'TRANSFER_IN', 'TRANSFER_OUT', 'ADJUSTMENT')"
        action: "FAIL"
        
      - name: "valid_location"
        expression: "location_id IS NOT NULL"
        action: "FAIL"
        
    # Table properties  
    table_properties:
      "delta.enableChangeDataFeed": "true"
      "delta.autoOptimize.optimizeWrite": "true"
      "delta.autoOptimize.autoCompact": "true"

# Monitoring and Alerting
monitoring:
  enabled: true
  
  # Streaming metrics to track
  streaming_metrics:
    - "inputRowsPerSecond"
    - "processedRowsPerSecond"  
    - "batchDuration"
    - "batchProcessingTime"
    - "numInputRows"
    - "stateStoreMemoryUsedBytes"
    
  # Data quality monitoring
  data_quality:
    enabled: true
    failure_threshold_percentage: 5.0
    monitoring_interval: "5 minutes"
    
    # Quality metrics to track
    metrics:
      - "expectation_failures_per_batch"
      - "record_processing_rate"
      - "data_freshness_lag"
      
  # Performance monitoring
  performance:
    latency_threshold_seconds: 30
    throughput_threshold_records_per_second: 1000
    memory_utilization_threshold_percentage: 85
    
  # Alerting configuration
  alerts:
    email_recipients: ["data-engineering@megamart.com", "platform-alerts@megamart.com"]
    slack_webhook_url: "${secrets/megamart-alerts/slack-webhook}"
    
    conditions:
      - name: "streaming_lag_high"
        condition: "batchProcessingTime > 30000"  # 30 seconds
        severity: "HIGH"
        
      - name: "data_quality_degraded"
        condition: "expectation_failures_percentage > 5"
        severity: "MEDIUM"
        
      - name: "throughput_low"
        condition: "processedRowsPerSecond < 100"
        severity: "MEDIUM"
        duration: "10 minutes"
        
      - name: "pipeline_failure"
        condition: "pipeline_state = 'FAILED'"
        severity: "CRITICAL"

# Error Handling and Recovery
error_handling:
  # Dead letter queue configuration
  dead_letter_queue:
    enabled: true
    target_table: "bronze_streaming.error_records"
    retention_days: 30
    
  # Retry configuration
  retry_policy:
    max_retries: 3
    retry_interval_seconds: 60
    exponential_backoff: true
    
  # Checkpoint management
  checkpoint_management:
    backup_interval: "1 hour"
    retention_period: "7 days"
    
# Cost Management
cost_management:
  # Auto-scaling configuration
  autoscaling:
    enabled: true
    scale_up_threshold: 80  # CPU utilization percentage
    scale_down_threshold: 30
    cooldown_period_minutes: 5
    
  # Resource optimization
  optimization:
    auto_terminate_idle_minutes: 30
    spot_instances: false  # Production workload requires reliability
    
  # Budget controls
  budget_alerts:
    daily_threshold_usd: 200
    monthly_threshold_usd: 5000

# Environment Configuration
environments:
  development:
    cluster_size: "small"
    min_workers: 1
    max_workers: 2
    continuous: false  # Triggered mode for dev
    
  test:
    cluster_size: "medium"
    min_workers: 1
    max_workers: 4
    continuous: true
    
  production:
    cluster_size: "large"  
    min_workers: 2
    max_workers: 8
    continuous: true

# Security and Compliance
security:
  # Service principal for pipeline execution
  service_principal: "megamart-bronze-streaming-sp"
  
  # Data encryption
  encryption:
    at_rest: true
    in_transit: true
    
  # Access control
  access_control:
    - principal: "data-engineers"
      permission: "CAN_MANAGE"
    - principal: "data-analysts"
      permission: "CAN_VIEW"
    - principal: "bronze-pipeline-service"
      permission: "CAN_RUN"
      
  # Compliance settings
  compliance:
    data_retention_days: 2555  # 7 years
    audit_logging: true
    change_data_capture: true

# Lineage and Governance
governance:
  # Data lineage tracking
  lineage:
    enabled: true
    upstream_systems: 
      - "kafka://pos-transactions-v1"
      - "kafka://customer-events-v1" 
      - "kafka://inventory-movements-v1"
    downstream_systems:
      - "silver_curated.pos_transactions_cleansed"
      - "silver_curated.customer_events_processed"
      - "silver_curated.inventory_movements_processed"
      
  # Business metadata
  business_context:
    purpose: "Real-time ingestion of operational data for immediate analysis and downstream processing"
    data_domains: ["sales", "customer", "inventory"]
    criticality: "high"
    
# Tags for resource management
tags:
  project: "megamart_retail360"
  environment: "production"
  layer: "bronze"
  pipeline_type: "streaming"
  cost_center: "data_platform"
  business_critical: "true"
  data_classification: "business_confidential" 
  backup_required: "true"
  generated_by: "nexa_platform"