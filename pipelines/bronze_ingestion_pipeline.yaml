# DLT Pipeline - Bronze Layer Data Ingestion
metadata:
  name: "bronze_ingestion_pipeline"
  description: "Delta Live Tables pipeline for ingesting raw data into bronze layer"
  layer: "bronze"
  created_by: "data_engineering_team"
  business_owner: "data_platform_team"

# Pipeline configuration based on Databricks API requirements
pipeline_config:
  name: "MegaMart Bronze Data Ingestion Pipeline"
  catalog: "megamart_retail360_prod"
  target: "bronze_raw"
  continuous: false  # Batch processing
  development: false
  edition: "ADVANCED"
  photon: true
  serverless: false
  
  # Cluster configuration
  clusters:
    - label: "default"
      autoscale:
        min_workers: 2
        max_workers: 8
        mode: "ENHANCED"
      node_type_id: "i3.xlarge"
      spark_version: "13.3.x-scala2.12"
      spark_conf:
        "spark.databricks.delta.autoOptimize.optimizeWrite": "true"
        "spark.databricks.delta.autoOptimize.autoCompact": "true"
        "spark.sql.adaptive.enabled": "true"
        "spark.sql.adaptive.coalescePartitions.enabled": "true"
      custom_tags:
        project: "megamart_retail360"
        layer: "bronze"
        environment: "production"

  # Configuration settings
  configuration:
    "pipelines.autoOptimize.managed": "true"
    "pipelines.enableChangeDataFeed": "true"
    "pipelines.autoOptimize.zOrderCols": "ingested_at"
    "pipelines.trigger.interval": "1 hour"

  # Storage configuration
  storage: "s3://megamart-data-lake-prod/pipelines/bronze_ingestion/"
  
  # Libraries - DLT notebooks for each data source
  libraries:
    - notebook:
        path: "/Workspace/megamart_retail360/notebooks/bronze/pos_transactions_bronze"
    - notebook:
        path: "/Workspace/megamart_retail360/notebooks/bronze/crm_customers_bronze"
    - notebook:
        path: "/Workspace/megamart_retail360/notebooks/bronze/product_catalog_bronze"
    - notebook:
        path: "/Workspace/megamart_retail360/notebooks/bronze/inventory_movements_bronze"
    - notebook:
        path: "/Workspace/megamart_retail360/notebooks/bronze/web_analytics_bronze"
    - notebook:
        path: "/Workspace/megamart_retail360/notebooks/bronze/social_media_bronze"
    - notebook:
        path: "/Workspace/megamart_retail360/notebooks/bronze/supplier_data_bronze"
    - notebook:
        path: "/Workspace/megamart_retail360/notebooks/bronze/store_operations_bronze"

  # Tags for pipeline management
  tags:
    environment: "production"
    layer: "bronze"
    data_domain: "raw_ingestion"
    business_critical: "true"
    cost_center: "data_platform"

# DLT Table Definitions
tables:
  pos_transactions:
    name: "pos_transactions"
    materialization: "STREAMING_TABLE"
    source_format: "cloudFiles"
    source_path: "s3://megamart-data-lake-prod/raw/pos_transactions/"
    schema_location: "s3://megamart-data-lake-prod/schemas/pos_transactions/"
    
    expectations:
      - name: "valid_transaction_id"
        expression: "transaction_id IS NOT NULL"
        action: "FAIL"
      - name: "positive_total_amount"
        expression: "total_amount > 0"
        action: "DROP"
      - name: "valid_timestamp"
        expression: "transaction_timestamp IS NOT NULL"
        action: "FAIL"
        
    partition_by: ["DATE(transaction_timestamp)"]
    cluster_by: ["store_id", "payment_method"]
    
  crm_customers:
    name: "crm_customers"
    materialization: "STREAMING_TABLE" 
    source_format: "delta"
    cdc_source: "salesforce_api"
    
    expectations:
      - name: "unique_customer_id"
        expression: "customer_id IS NOT NULL"
        action: "FAIL"
      - name: "valid_email_format"
        expression: "email RLIKE '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$'"
        action: "QUARANTINE"
        
    partition_by: ["DATE(registration_date)"]
    cluster_by: ["customer_segment", "loyalty_tier"]
    
  product_catalog:
    name: "product_catalog"
    materialization: "MATERIALIZED_VIEW"
    source_format: "json"
    source_path: "s3://megamart-data-lake-prod/raw/product_catalog/"
    refresh_interval: "1 DAY"
    
    expectations:
      - name: "valid_product_id"
        expression: "product_id IS NOT NULL"
        action: "FAIL"
      - name: "unique_sku"
        expression: "sku IS NOT NULL"
        action: "FAIL"
      - name: "positive_price"
        expression: "current_price > 0"
        action: "DROP"
        
    partition_by: ["category_l1"]
    cluster_by: ["brand", "is_active"]

  inventory_movements:
    name: "inventory_movements"
    materialization: "STREAMING_TABLE"
    source_format: "cloudFiles"
    source_path: "s3://megamart-data-lake-prod/raw/inventory/"
    schema_evolution: "enabled"
    
    expectations:
      - name: "valid_movement_id"
        expression: "movement_id IS NOT NULL"
        action: "FAIL"
      - name: "valid_movement_type"
        expression: "movement_type IN ('RECEIPT', 'SALE', 'TRANSFER_IN', 'TRANSFER_OUT', 'ADJUSTMENT')"
        action: "DROP"
      - name: "non_negative_quantity_after"
        expression: "quantity_after >= 0"
        action: "QUARANTINE"
        
    partition_by: ["DATE(movement_timestamp)", "location_type"]
    cluster_by: ["location_id", "product_id"]

  web_analytics_events:
    name: "web_analytics_events"
    materialization: "STREAMING_TABLE"
    source_format: "cloudFiles"
    source_path: "s3://megamart-data-lake-prod/raw/web_analytics/"
    
    expectations:
      - name: "valid_event_id"
        expression: "event_id IS NOT NULL"
        action: "FAIL"
      - name: "valid_session_id"
        expression: "session_id IS NOT NULL"
        action: "FAIL"
      - name: "recent_timestamp"
        expression: "event_timestamp > current_timestamp() - INTERVAL 7 DAYS"
        action: "DROP"
        
    partition_by: ["DATE(event_timestamp)"]
    cluster_by: ["event_name", "device_category"]

  social_media_posts:
    name: "social_media_posts"
    materialization: "STREAMING_TABLE"
    source_format: "cloudFiles"
    source_path: "s3://megamart-data-lake-prod/raw/social_media/"
    
    expectations:
      - name: "valid_post_id"
        expression: "post_id IS NOT NULL"
        action: "FAIL"
      - name: "valid_platform"
        expression: "platform IN ('twitter', 'facebook', 'instagram', 'tiktok', 'youtube')"
        action: "DROP"
        
    partition_by: ["DATE(post_timestamp)", "platform"]
    cluster_by: ["sentiment_label", "engagement_total"]

# Data Quality Monitoring
data_quality:
  enabled: true
  
  global_expectations:
    - name: "data_freshness"
      description: "Data should be ingested within SLA"
      expression: "ingested_at > current_timestamp() - INTERVAL 4 HOURS"
      action: "WARN"
      
    - name: "no_duplicate_keys"
      description: "Primary keys should be unique"
      check_type: "uniqueness"
      action: "FAIL"
      
  quality_metrics:
    - metric: "row_count"
      threshold_min: 1000
    - metric: "completeness_rate"
      threshold_min: 0.95
    - metric: "duplicate_rate"
      threshold_max: 0.01

# Monitoring and Alerting
monitoring:
  pipeline_health:
    enabled: true
    sla_minutes: 120  # 2 hours
    
  notifications:
    - alerts:
        - on_failure: ["data-engineering@megamart.com"]
        - on_success: []
    - webhook_notifications:
        on_failure:
          - id: "slack_data_alerts"

  metrics_tracking:
    - "records_processed_per_hour"
    - "pipeline_duration_minutes"
    - "data_quality_score"
    - "cost_per_processed_gb"

# Schedule Configuration
schedule:
  # Continuous streaming for real-time sources
  streaming_tables:
    trigger: "continuous"
    max_latency: "10 minutes"
    
  # Batch processing for daily sources
  materialized_views:
    trigger: "scheduled"
    interval: "1 hour"
    timezone: "UTC"

# Performance Optimization
performance:
  auto_optimize:
    enabled: true
    optimize_write: true
    auto_compact: true
    
  photon_acceleration: true
  
  cluster_autoscaling:
    enabled: true
    min_workers: 2
    max_workers: 8
    target_utilization: 0.7

# Security and Access
security:
  service_principal: "megamart-bronze-pipeline-sp"
  
  permissions:
    - principal: "data-engineers"
      permission: "CAN_MANAGE"
    - principal: "data-analysts"
      permission: "CAN_VIEW"
    - principal: "megamart-etl-service"
      permission: "CAN_RUN"

# Environment Configuration
environments:
  development:
    catalog: "megamart_retail360_dev"
    cluster_size: "small"
    continuous: false
    
  test:
    catalog: "megamart_retail360_test"
    cluster_size: "medium"
    continuous: false
    
  production:
    catalog: "megamart_retail360_prod"
    cluster_size: "large"
    continuous: true

# Cost Management
cost_management:
  budget_alerts:
    daily_threshold_usd: 500
    monthly_threshold_usd: 12000
    
  optimization:
    auto_terminate_idle_minutes: 30
    spot_instances: false  # Production workload
    
# Lineage and Documentation
lineage:
  upstream_sources:
    - "s3://megamart-data-lake-prod/raw/"
    - "salesforce_crm_api"
    - "google_analytics_4_export"
    
  downstream_consumers:
    - "silver_transformation_pipeline"
    - "data_quality_monitoring_dashboard"
    
  business_purpose: "Ingest raw data from all source systems into bronze layer for further processing"

# Tags for governance and cost tracking
tags:
  environment: "production"
  layer: "bronze"
  cost_center: "data_platform"
  business_critical: "true"
  data_classification: "raw_operational"
  backup_required: "true"