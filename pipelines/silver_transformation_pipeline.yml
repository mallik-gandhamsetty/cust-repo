# Silver Transformation Pipeline - Data Cleansing and Enrichment
# Transform Bronze data with JSON flattening, cleansing, and business logic
# Generated by Nexa Platform - DO NOT EDIT MANUALLY

metadata:
  name: "silver_transformation_pipeline"
  description: "Data cleansing, enrichment, and transformation from Bronze to Silver layer"
  version: "1.0.0"
  layer: "silver"
  pipeline_type: "mixed"  # Both streaming and batch transformations
  created_by: "nexa_platform"
  business_owner: "data_platform_team"
  
# Pipeline Configuration for Databricks DLT
pipeline_config:
  name: "MegaMart Silver Data Transformation"
  catalog: "megamart_retail360_prod"
  target: "silver_curated"
  continuous: true  # Mixed mode: streaming for real-time, batch for daily aggregates
  development: false
  edition: "ADVANCED"
  photon: true
  serverless: false
  
  # Cluster configuration optimized for transformation workloads
  clusters:
    - label: "transformation_cluster"
      policy_id: "transformation_optimized_policy"
      autoscale:
        min_workers: 3
        max_workers: 12
        mode: "ENHANCED"
      node_type_id: "i3.xlarge"
      spark_version: "13.3.x-scala2.12"
      
      # Spark configuration for transformation optimization
      spark_conf:
        "spark.sql.adaptive.enabled": "true"
        "spark.sql.adaptive.coalescePartitions.enabled": "true"
        "spark.sql.adaptive.skewJoin.enabled": "true"
        "spark.databricks.delta.optimizeWrite.enabled": "true"
        "spark.databricks.delta.autoCompact.enabled": "true"
        "spark.databricks.io.cache.enabled": "true"
        "spark.sql.execution.arrow.pyspark.enabled": "true"
        "spark.sql.streaming.metricsEnabled": "true"
        
      # Custom tags for cost tracking
      custom_tags:
        project: "megamart_retail360"
        layer: "silver"
        pipeline_type: "transformation"
        environment: "production"
        cost_center: "data_platform"
        
  # Global pipeline configuration
  configuration:
    # Transformation specific settings
    "pipelines.trigger.interval": "1 minute"
    "pipelines.enableChangeDataFeed": "true"
    "pipelines.autoOptimize.managed": "true"
    "pipelines.autoOptimize.zOrderCols": "customer_id,transaction_date,product_id"
    
    # JSON processing optimizations
    "spark.sql.parser.quotedRegexColumnNames": "true"
    "spark.sql.json.filterPushdown.enabled": "true"
    
    # Memory management
    "spark.sql.adaptive.advisoryPartitionSizeInBytes": "128MB"
    "spark.sql.adaptive.maxShuffleHashJoinLocalMapThreshold": "100MB"
    
  # Storage configuration  
  storage: "s3://megamart-data-lake-prod/pipelines/silver_transformation/"
  
  # Pipeline libraries - SQL transformations
  libraries:
    - file:
        path: "/Workspace/megamart_retail360/transformations/silver/pos_transactions_cleansed.sql"
    - file:
        path: "/Workspace/megamart_retail360/transformations/silver/customer_profiles_enriched.sql"
    - file:
        path: "/Workspace/megamart_retail360/transformations/silver/product_catalog_standardized.sql"
    - file:
        path: "/Workspace/megamart_retail360/transformations/silver/inventory_movements_processed.sql"
    - file:
        path: "/Workspace/megamart_retail360/transformations/silver/web_events_sessionized.sql"
    - file:
        path: "/Workspace/megamart_retail360/transformations/silver/social_media_sentiment.sql"
        
  # Pipeline dependencies - must wait for Bronze layer completion
  dependencies:
    - pipeline_id: "bronze_streaming_pipeline"
      relationship: "upstream"
    - pipeline_id: "bronze_batch_pipeline" 
      relationship: "upstream"
      
  # Pipeline permissions
  permissions:
    - user_name: "data-engineers@megamart.com"
      permission_level: "CAN_MANAGE"
    - user_name: "data-analysts@megamart.com"
      permission_level: "CAN_VIEW"
    - service_principal_name: "megamart-silver-transformation-sp"
      permission_level: "CAN_RUN"
      
  # Tags for organization and governance
  tags:
    environment: "production"
    layer: "silver" 
    pipeline_type: "transformation"
    data_domains: "sales,customer,product,inventory"
    business_critical: "true"

# Source Dependencies
source_dependencies:
  bronze_streaming:
    tables:
      - name: "pos_transactions"
        freshness_requirement: "5 minutes"
        schema_evolution: "compatible"
        
      - name: "customer_events"
        freshness_requirement: "3 minutes"
        schema_evolution: "compatible"
        
      - name: "inventory_movements"
        freshness_requirement: "10 minutes"
        schema_evolution: "compatible"
        
  bronze_batch:
    tables:
      - name: "crm_customers"
        freshness_requirement: "1 hour"
        schema_evolution: "additive"
        
      - name: "product_catalog"
        freshness_requirement: "4 hours"
        schema_evolution: "additive"
        
      - name: "web_analytics"
        freshness_requirement: "30 minutes"
        schema_evolution: "compatible"
        
      - name: "social_media"
        freshness_requirement: "15 minutes"
        schema_evolution: "compatible"

# Transformation Specifications
transformations:
  
  # Real-time transaction cleansing with JSON flattening
  - name: "pos_transactions_cleansed"
    type: "STREAMING_TABLE"
    source_table: "bronze_streaming.pos_transactions"
    description: "Cleansed and enriched POS transaction data with JSON flattening"
    
    # Processing configuration
    processing:
      watermark:
        column: "transaction_timestamp"
        delay_threshold: "1 minute"
      checkpoint_location: "s3://megamart-data-lake-prod/checkpoints/silver_pos_transactions/"
      
    # Partitioning and optimization
    physical_properties:
      partition_by: ["transaction_date", "store_id"]
      cluster_by: ["customer_id", "payment_method_clean"]
      z_order_by: ["transaction_timestamp", "total_amount"]
      
    # JSON transformation rules
    json_transformations:
      - source_column: "items"
        target_columns:
          - name: "item_count"
            expression: "SIZE(FROM_JSON(items, 'array<struct<product_id:string>>')) as item_count"
          - name: "total_quantity" 
            expression: "AGGREGATE(FROM_JSON(items, 'array<struct<quantity:int>>'), 0, (acc, x) -> acc + COALESCE(x.quantity, 0)) as total_quantity"
          - name: "items_json"
            expression: "CASE WHEN items != '[]' THEN items ELSE NULL END as items_json"
            
      - source_column: "promotion_codes"
        target_columns:
          - name: "promotion_count"
            expression: "SIZE(FROM_JSON(promotion_codes, 'array<string>')) as promotion_count"
          - name: "promotion_codes_json"
            expression: "CASE WHEN promotion_codes != '[]' THEN promotion_codes ELSE NULL END as promotion_codes_json"
            
    # Data quality expectations
    expectations:
      - name: "valid_transaction_id"
        expression: "transaction_id IS NOT NULL"
        action: "FAIL"
        
      - name: "positive_amounts"
        expression: "total_amount > 0 AND subtotal > 0"
        action: "DROP"
        
      - name: "amounts_balance"
        expression: "ABS(total_amount - calculated_total) < 0.01"
        action: "QUARANTINE"
        
    # Business enrichments
    enrichments:
      - name: "time_classifications"
        fields:
          - "time_of_day: CASE WHEN HOUR(transaction_timestamp) BETWEEN 6 AND 11 THEN 'Morning' ELSE 'Other' END"
          - "day_name: DAYNAME(transaction_timestamp)"
          - "is_weekend: DAYOFWEEK(transaction_timestamp) IN (1, 7)"
          
      - name: "customer_classifications"
        fields:
          - "customer_type: CASE WHEN customer_id IS NOT NULL THEN 'Member' ELSE 'Guest' END"
          - "transaction_size: CASE WHEN total_amount < 10 THEN 'Small' WHEN total_amount < 50 THEN 'Medium' ELSE 'Large' END"
          
    # Table properties
    table_properties:
      "delta.enableChangeDataFeed": "true"
      "delta.autoOptimize.optimizeWrite": "true"
      "delta.autoOptimize.autoCompact": "true"
      "delta.deletedFileRetentionDuration": "interval 7 days"
      
  # Customer profile enrichment with calculated metrics  
  - name: "customer_profiles_enriched"
    type: "MATERIALIZED_VIEW"
    source_tables: 
      - "bronze_batch.crm_customers"
      - "silver_curated.pos_transactions_cleansed"
    description: "Enriched customer profiles with transaction history and RFM analysis"
    
    # Refresh configuration
    refresh:
      interval: "30 minutes"
      mode: "INCREMENTAL"
      
    # Partitioning and optimization
    physical_properties:
      partition_by: ["customer_segment", "registration_year"]
      cluster_by: ["loyalty_tier", "is_active"]
      z_order_by: ["customer_id", "lifetime_value"]
      
    # Complex enrichments requiring joins and aggregations
    enrichments:
      - name: "transaction_metrics"
        description: "Calculate customer transaction history and metrics"
        join_strategy: "LEFT JOIN"
        aggregations:
          - "COUNT(*) as total_transactions"
          - "SUM(total_amount) as lifetime_value" 
          - "AVG(total_amount) as average_transaction_value"
          - "MAX(transaction_timestamp) as last_transaction_date"
          - "DATEDIFF(current_date(), MAX(transaction_date)) as days_since_last_purchase"
          
      - name: "rfm_analysis"
        description: "Recency, Frequency, Monetary analysis for customer segmentation"
        calculations:
          - "recency: DATEDIFF(current_date(), MAX(transaction_date))"
          - "frequency: COUNT(*) / DATEDIFF(MAX(transaction_date), MIN(transaction_date))"
          - "monetary: AVG(total_amount)"
          
      - name: "customer_segmentation"
        description: "Assign customers to behavioral segments"
        segments:
          - "Champions: recency <= 30 AND frequency >= 5 AND monetary >= 500"
          - "Loyal Customers: recency <= 30 AND frequency >= 3 AND monetary >= 200"
          - "New Customers: recency <= 30 AND frequency = 1"
          - "Need Attention: recency BETWEEN 61 AND 120"
          - "Lost: recency > 365"
          
    # Data quality expectations
    expectations:
      - name: "valid_customer_id"
        expression: "customer_id IS NOT NULL"
        action: "FAIL"
        
      - name: "valid_email_format"
        expression: "email_clean RLIKE '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$' OR email_clean IS NULL"
        action: "QUARANTINE"
        
    # Table properties
    table_properties:
      "delta.enableChangeDataFeed": "true"
      "delta.autoOptimize.optimizeWrite": "true"
      "delta.autoOptimize.autoCompact": "true"
      
  # Product catalog standardization
  - name: "product_catalog_standardized"
    type: "MATERIALIZED_VIEW"
    source_table: "bronze_batch.product_catalog"
    description: "Standardized product catalog with cleansed attributes and hierarchy"
    
    # Refresh configuration
    refresh:
      interval: "1 hour"
      mode: "COMPLETE"  # Full refresh for master data
      
    # Partitioning and optimization
    physical_properties:
      partition_by: ["category_l1", "is_active"]
      cluster_by: ["brand", "supplier_id"]
      z_order_by: ["product_id", "modified_date"]
      
    # Data standardization rules
    standardizations:
      - name: "category_hierarchy"
        description: "Standardize product category hierarchy"
        rules:
          - "category_l1: UPPER(TRIM(category_l1))"
          - "category_path: CONCAT_WS(' > ', category_l1, category_l2, category_l3)"
          
      - name: "price_validations"
        description: "Validate and standardize pricing"
        rules:
          - "current_price: CASE WHEN current_price <= 0 THEN NULL ELSE current_price END"
          - "cost_price: CASE WHEN cost_price > current_price THEN NULL ELSE cost_price END"
          
      - name: "attribute_parsing"
        description: "Parse JSON attributes into structured columns"
        json_extractions:
          - source_column: "attributes"
            target_columns:
              - "brand_verified: GET_JSON_OBJECT(attributes, '$.brand_verified')"
              - "eco_friendly: GET_JSON_OBJECT(attributes, '$.eco_friendly')"
              - "seasonal: GET_JSON_OBJECT(attributes, '$.seasonal')"
              
    # Data quality expectations
    expectations:
      - name: "valid_product_id"
        expression: "product_id IS NOT NULL AND LENGTH(product_id) >= 5"
        action: "FAIL"
        
      - name: "valid_price"
        expression: "current_price > 0"
        action: "FAIL"
        
      - name: "valid_category"
        expression: "category_l1 IS NOT NULL"
        action: "FAIL"

# Data Quality Framework
data_quality:
  enabled: true
  
  # Global quality rules applied to all transformations
  global_rules:
    - name: "no_null_primary_keys"
      description: "Primary key columns must not be null"
      severity: "CRITICAL"
      
    - name: "timestamp_within_range"
      description: "Timestamps must be within reasonable range"
      expression: "timestamp_column > '2020-01-01' AND timestamp_column <= current_timestamp()"
      severity: "HIGH"
      
    - name: "positive_amounts"
      description: "Monetary amounts must be positive"
      expression: "amount_column > 0"
      severity: "HIGH"
      
  # Quality monitoring and alerting
  monitoring:
    failure_threshold_percentage: 2.0
    monitoring_interval: "5 minutes"
    
    # Metrics to track
    metrics:
      - "record_processing_rate"
      - "transformation_latency"  
      - "data_quality_score"
      - "schema_evolution_events"
      
  # Quality remediation
  remediation:
    auto_quarantine: true
    quarantine_table_suffix: "_quarantine"
    max_quarantine_percentage: 10.0

# Performance Optimization
performance:
  # Caching strategy
  caching:
    enabled: true
    cache_level: "DISK_ONLY"
    
    # Tables to cache
    cached_tables:
      - "bronze_batch.product_catalog"  # Slow-changing dimension
      - "silver_curated.customer_profiles_enriched"  # Frequently joined
      
  # Broadcast joins
  broadcast_joins:
    enabled: true
    size_threshold_mb: 200
    
    # Tables to broadcast
    broadcast_tables:
      - "bronze_batch.product_catalog"
      - "reference_data.store_locations"
      
  # Partition pruning
  partition_pruning:
    enabled: true
    predicate_pushdown: true
    
  # Adaptive query execution
  adaptive_execution:
    enabled: true
    coalesce_partitions: true
    skew_join_optimization: true

# Monitoring and Alerting
monitoring:
  enabled: true
  
  # Pipeline health metrics
  health_metrics:
    - "pipeline_success_rate"
    - "average_processing_time"
    - "data_freshness_lag"
    - "transformation_throughput"
    
  # Data quality metrics
  quality_metrics:
    - "expectation_success_rate"
    - "quarantined_record_percentage"
    - "schema_evolution_frequency"
    
  # Resource utilization metrics
  resource_metrics:
    - "cluster_utilization"
    - "memory_usage"
    - "cpu_usage"
    - "storage_usage"
    
  # Alerting configuration
  alerts:
    email_recipients: ["data-engineering@megamart.com", "data-quality@megamart.com"]
    slack_webhook_url: "${secrets/megamart-alerts/slack-webhook}"
    
    conditions:
      - name: "transformation_failure"
        condition: "pipeline_success_rate < 95"
        severity: "HIGH"
        duration: "10 minutes"
        
      - name: "data_quality_degraded"
        condition: "expectation_success_rate < 98"
        severity: "MEDIUM"
        duration: "15 minutes"
        
      - name: "processing_delay"
        condition: "data_freshness_lag > 30 minutes"
        severity: "MEDIUM"

# Schema Evolution Management  
schema_evolution:
  enabled: true
  
  # Evolution policies by table
  policies:
    - table_pattern: "pos_transactions*"
      allow_column_additions: true
      allow_column_type_changes: false
      allow_column_deletions: false
      
    - table_pattern: "customer_profiles*"
      allow_column_additions: true
      allow_column_type_changes: true  # Allow widening
      allow_column_deletions: false
      
    - table_pattern: "product_catalog*"
      allow_column_additions: true
      allow_column_type_changes: true
      allow_column_deletions: false
      
  # Notification settings
  notifications:
    enabled: true
    recipients: ["data-engineering@megamart.com"]
    include_schema_diff: true

# Environment Configuration
environments:
  development:
    cluster_size: "small"
    refresh_intervals:
      materialized_views: "2 hours"
    data_retention_days: 30
    
  test:
    cluster_size: "medium"
    refresh_intervals:
      materialized_views: "1 hour"
    data_retention_days: 90
    
  production:
    cluster_size: "large"
    refresh_intervals:
      materialized_views: "30 minutes"
    data_retention_days: 2555  # 7 years

# Security and Compliance
security:
  service_principal: "megamart-silver-transformation-sp"
  
  # Data masking rules
  data_masking:
    enabled: true
    rules:
      - column_pattern: "*email*"
        masking_function: "mask_email"
      - column_pattern: "*phone*" 
        masking_function: "mask_phone"
      - column_pattern: "*ssn*"
        masking_function: "mask_ssn"
        
  # Access control
  access_control:
    - principal: "data-engineers"
      permission: "CAN_MANAGE"
    - principal: "data-analysts"
      permission: "CAN_VIEW"
    - principal: "silver-transformation-service"
      permission: "CAN_RUN"
      
  # Audit logging
  audit:
    enabled: true
    log_level: "INFO"
    retention_days: 90

# Tags for resource management
tags:
  project: "megamart_retail360"
  environment: "production"
  layer: "silver"
  pipeline_type: "transformation"
  cost_center: "data_platform"
  business_critical: "true"
  data_classification: "business_confidential"
  backup_required: "true"
  generated_by: "nexa_platform"