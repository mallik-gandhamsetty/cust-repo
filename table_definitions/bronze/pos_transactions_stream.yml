# Bronze Layer - POS Transactions Stream (Kafka Source)
# Real-time point-of-sale transaction data ingestion
metadata:
  name: "bronze_pos_transactions_stream"
  description: "Real-time POS transaction stream from Kafka topic pos-transactions-v1"
  layer: "bronze"
  source_system: "kafka_pos_systems"
  data_classification: "transaction_data"
  created_by: "nexa_platform"
  materialization: "STREAMING_TABLE"
  
# Unity Catalog Configuration
unity_catalog:
  catalog: "workspace"
  schema: "bronze_streaming"
  table_name: "pos_transactions"
  table_type: "MANAGED"
  
# Kafka Source Configuration
source:
  type: "kafka"
  topic: "pos-transactions-v1"
  format: "json"
  
  kafka_config:
    bootstrap_servers: "kafka-cluster.megamart.internal:9092"
    security_protocol: "SASL_SSL"
    sasl_mechanism: "PLAIN"
    auto_offset_reset: "latest"
    enable_auto_commit: false
    
  streaming_options:
    maxOffsetsPerTrigger: 10000
    startingOffsets: "latest"
    failOnDataLoss: false
    kafka.request.timeout.ms: 60000
    kafka.session.timeout.ms: 30000
    
# Table Schema Definition
schema:
  - name: "transaction_id"
    type: "string"
    nullable: false
    description: "Unique transaction identifier from POS system"
    
  - name: "store_id"
    type: "string"  
    nullable: false
    description: "Store identifier where transaction occurred"
    
  - name: "register_id"
    type: "string"
    nullable: false
    description: "Cash register/terminal identifier"
    
  - name: "cashier_id"
    type: "string"
    nullable: true
    description: "Employee ID of cashier"
    
  - name: "customer_id" 
    type: "string"
    nullable: true
    description: "Customer loyalty card ID if available"
    
  - name: "transaction_timestamp"
    type: "timestamp"
    nullable: false
    description: "Transaction date and time"
    
  - name: "transaction_date"
    type: "date"
    nullable: false  
    description: "Transaction date for partitioning"
    generated_column: "CAST(transaction_timestamp AS DATE)"
    
  - name: "items"
    type: "string"
    nullable: false
    description: "JSON array of purchased items with details"
    
  - name: "subtotal"
    type: "decimal(15,2)"
    nullable: false
    description: "Pre-tax transaction subtotal"
    
  - name: "tax_amount"
    type: "decimal(10,2)"
    nullable: false
    description: "Total tax amount"
    
  - name: "discount_amount"
    type: "decimal(10,2)"
    nullable: true
    description: "Total discount applied"
    
  - name: "total_amount"
    type: "decimal(15,2)" 
    nullable: false
    description: "Final transaction total"
    
  - name: "payment_method"
    type: "string"
    nullable: false
    description: "Payment method used"
    
  - name: "payment_details"
    type: "string"
    nullable: true
    description: "Additional payment details (masked)"
    
  - name: "receipt_number"
    type: "string"
    nullable: true
    description: "Receipt number for reference"
    
  - name: "promotion_codes"
    type: "string"
    nullable: true
    description: "Applied promotion/coupon codes (JSON array)"
    
  - name: "loyalty_points_earned"
    type: "int"
    nullable: true
    description: "Loyalty points earned in transaction"
    
  - name: "loyalty_points_redeemed"
    type: "int"
    nullable: true
    description: "Loyalty points redeemed in transaction"
    
  - name: "kafka_partition"
    type: "int"
    nullable: false
    description: "Kafka partition number"
    
  - name: "kafka_offset"
    type: "long"
    nullable: false
    description: "Kafka offset for exactly-once processing"
    
  - name: "kafka_timestamp"
    type: "timestamp"
    nullable: false
    description: "Kafka message timestamp"
    
  - name: "ingested_at"
    type: "timestamp"
    nullable: false
    description: "Data ingestion timestamp"
    generated_column: "current_timestamp()"

# Table Properties and Optimization
table_properties:
  "delta.enableChangeDataFeed": "true"
  "delta.autoOptimize.optimizeWrite": "true"  
  "delta.autoOptimize.autoCompact": "true"
  "delta.deletedFileRetentionDuration": "interval 7 days"
  "delta.logRetentionDuration": "interval 30 days"
  "delta.checkpoint.writeStatsAsJson": "true"
  "delta.checkpoint.writeStatsAsStruct": "true"

# Partitioning and Clustering Strategy
partitioning:
  partition_by: ["transaction_date"]
  cluster_by: ["store_id", "payment_method"]
  z_order_by: ["transaction_timestamp", "customer_id"]

# Data Quality Expectations
expectations:
  - name: "valid_transaction_id"
    expression: "transaction_id IS NOT NULL AND LENGTH(transaction_id) >= 10"
    action: "FAIL"
    tag: "validity"
    
  - name: "positive_total_amount"
    expression: "total_amount > 0"
    action: "FAIL"
    tag: "business_rule"
    
  - name: "valid_timestamp"
    expression: "transaction_timestamp > current_timestamp() - INTERVAL 1 DAY AND transaction_timestamp <= current_timestamp()"
    action: "DROP"
    tag: "data_freshness"
    
  - name: "store_id_format"
    expression: "store_id RLIKE '^STORE_[0-9]{4}$'"
    action: "QUARANTINE"
    tag: "format_validation"
    
  - name: "payment_method_values"
    expression: "payment_method IN ('CASH', 'CREDIT', 'DEBIT', 'MOBILE', 'GIFT_CARD', 'CHECK')"
    action: "FAIL"
    tag: "reference_data"
    
  - name: "items_json_valid"
    expression: "items IS NOT NULL AND LENGTH(items) > 0"
    action: "FAIL" 
    tag: "completeness"
    
  - name: "amounts_consistency"
    expression: "ABS(total_amount - (subtotal + COALESCE(tax_amount, 0) - COALESCE(discount_amount, 0))) < 0.01"
    action: "QUARANTINE"
    tag: "business_rule"

# Streaming Configuration
streaming:
  trigger: "processingTime"
  interval: "5 seconds"
  checkpointLocation: "s3://megamart-data-lake-prod/checkpoints/bronze_pos_transactions_stream/"
  
  watermark:
    column: "transaction_timestamp"
    delay_threshold: "1 minute"
    
  duplicate_handling:
    primary_keys: ["transaction_id", "kafka_partition", "kafka_offset"]
    merge_condition: "target.transaction_id = source.transaction_id"

# Monitoring and Observability
monitoring:
  data_quality:
    enabled: true
    expectation_failure_threshold: 0.01  # 1%
    
  performance:
    enabled: true
    latency_threshold_seconds: 30
    throughput_threshold_records_per_second: 1000
    
  alerts:
    - name: "high_failure_rate"
      condition: "expectation_failures > 100 in 5 minutes"
      severity: "high"
      
    - name: "processing_delay"
      condition: "streaming_lag > 2 minutes"
      severity: "medium"
      
    - name: "low_throughput"
      condition: "records_per_second < 100 for 10 minutes"
      severity: "low"

# Access Control
access_control:
  read_access: ["data_engineers", "data_analysts", "bronze_pipeline_service"]
  write_access: ["bronze_pipeline_service", "kafka_ingestion_service"]
  admin_access: ["data_engineering_leads", "platform_admins"]

# Retention and Lifecycle
retention:
  raw_data_days: 2555  # 7 years for compliance
  checkpoint_days: 30
  vacuum_enabled: true
  vacuum_retention_hours: 168  # 7 days

# Lineage and Governance
lineage:
  upstream_sources: ["kafka://pos-transactions-v1"]
  downstream_tables: ["silver_curated.pos_transactions_cleansed"]
  business_purpose: "Real-time ingestion of point-of-sale transaction data for immediate processing"
  data_domain: "sales_transactions"
  
# Tags for Governance
tags:
  environment: "production"
  layer: "bronze"
  source_type: "streaming"
  data_domain: "sales"
  pii_data: "false"
  compliance: "pci_dss"
  retention_policy: "7_years"
  critical_business_data: "true"