# Gold Layer - Customer 360 Master View
# Comprehensive customer analytics with behavioral insights and recommendations
metadata:
  name: "gold_customer_360"
  description: "Comprehensive customer view combining all touchpoints and behavioral analytics"
  layer: "gold"
  source_system: "silver_curated.customer_profiles_enriched"
  data_classification: "customer_analytics_data"
  created_by: "nexa_platform"
  materialization: "MATERIALIZED_VIEW"
  
# Unity Catalog Configuration
unity_catalog:
  catalog: "workspace"
  schema: "gold_analytics"
  table_name: "customer_360"
  table_type: "MANAGED"
  
# Source Configuration
source:
  type: "materialized_view"
  source_tables: 
    - "silver_curated.customer_profiles_enriched"
    - "silver_curated.pos_transactions_cleansed"
    - "silver_curated.web_events_sessionized"
  refresh_interval: "30 minutes"
  
# Table Schema Definition (Key fields from transformation)
schema:
  - name: "customer_id"
    type: "string"
    nullable: false
    description: "Unique customer identifier"
    
  - name: "full_name"
    type: "string"
    nullable: true
    description: "Customer full name"
    
  - name: "email"
    type: "string"
    nullable: true
    description: "Customer email address"
    
  - name: "phone"
    type: "string"
    nullable: true
    description: "Customer phone number"
    
  - name: "city"
    type: "string"
    nullable: true
    description: "Customer city"
    
  - name: "state_province"
    type: "string"
    nullable: true
    description: "Customer state or province"
    
  - name: "country_code"
    type: "string"
    nullable: true
    description: "Customer country code"
    
  - name: "age_years"
    type: "int"
    nullable: true
    description: "Customer age in years"
    
  - name: "age_group"
    type: "string"
    nullable: false
    description: "Age group classification"
    
  - name: "gender"
    type: "string"
    nullable: false
    description: "Customer gender"
    
  - name: "registration_date"
    type: "date"
    nullable: true
    description: "Customer registration date"
    
  - name: "customer_tenure_days"
    type: "int"
    nullable: true
    description: "Days since registration"
    
  - name: "is_active"
    type: "boolean"
    nullable: false
    description: "Whether customer is active"
    
  - name: "loyalty_tier"
    type: "string"
    nullable: false
    description: "Customer loyalty tier"
    
  - name: "loyalty_points_balance"
    type: "int"
    nullable: false
    description: "Current loyalty points balance"
    
  - name: "customer_segment"
    type: "string"
    nullable: false
    description: "RFM-based customer segment"
    
  - name: "value_tier"
    type: "string"
    nullable: false
    description: "Customer value tier"
    
  - name: "engagement_score"
    type: "int"
    nullable: false
    description: "Customer engagement score (0-100)"
    
  # Transaction behavior metrics
  - name: "total_transactions"
    type: "int"
    nullable: false
    description: "Lifetime transaction count"
    
  - name: "lifetime_value"
    type: "decimal(15,2)"
    nullable: false
    description: "Customer lifetime value"
    
  - name: "avg_transaction_value"
    type: "decimal(10,2)"
    nullable: false
    description: "Average transaction value"
    
  - name: "total_items_purchased"
    type: "int"
    nullable: false
    description: "Total items purchased"
    
  - name: "stores_visited"
    type: "int"
    nullable: false
    description: "Number of unique stores visited"
    
  - name: "first_transaction_date"
    type: "date"
    nullable: true
    description: "Date of first transaction"
    
  - name: "last_transaction_date"
    type: "date"
    nullable: true
    description: "Date of last transaction"
    
  - name: "days_since_last_purchase"
    type: "int"
    nullable: false
    description: "Days since last purchase"
    
  # Behavioral preferences
  - name: "preferred_shopping_day"
    type: "string"
    nullable: false
    description: "Preferred day of week for shopping"
    
  - name: "preferred_payment_method"
    type: "string"
    nullable: false
    description: "Most frequently used payment method"
    
  - name: "preferred_transaction_size"
    type: "string"
    nullable: false
    description: "Most common transaction size category"
    
  - name: "morning_preference_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of transactions in morning"
    
  - name: "afternoon_preference_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of transactions in afternoon"
    
  - name: "evening_preference_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of transactions in evening"
    
  # Recent activity metrics
  - name: "transactions_30d"
    type: "int"
    nullable: false
    description: "Transactions in last 30 days"
    
  - name: "spend_30d"
    type: "decimal(15,2)"
    nullable: false
    description: "Spend in last 30 days"
    
  - name: "transactions_90d"
    type: "int"
    nullable: false
    description: "Transactions in last 90 days"
    
  - name: "spend_90d"
    type: "decimal(15,2)"
    nullable: false
    description: "Spend in last 90 days"
    
  - name: "transaction_frequency_30d"
    type: "decimal(8,2)"
    nullable: false
    description: "Average transactions per active day (30d)"
    
  # Loyalty and promotions
  - name: "total_points_earned"
    type: "int"
    nullable: false
    description: "Total loyalty points earned"
    
  - name: "total_points_redeemed"
    type: "int"
    nullable: false
    description: "Total loyalty points redeemed"
    
  - name: "discount_usage_rate_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of transactions with discounts"
    
  - name: "total_discounts_received"
    type: "decimal(15,2)"
    nullable: false
    description: "Total discount amount received"
    
  # Seasonality and trends
  - name: "avg_winter_spend"
    type: "decimal(10,2)"
    nullable: false
    description: "Average spend during winter months"
    
  - name: "avg_spring_spend"
    type: "decimal(10,2)"
    nullable: false
    description: "Average spend during spring months"
    
  - name: "avg_summer_spend"
    type: "decimal(10,2)"
    nullable: false
    description: "Average spend during summer months"
    
  - name: "avg_fall_spend"
    type: "decimal(10,2)"
    nullable: false
    description: "Average spend during fall months"
    
  - name: "spending_trend"
    type: "string"
    nullable: false
    description: "Spending trend direction (Growing, Declining, Stable)"
    
  # Business metrics
  - name: "annual_customer_value"
    type: "decimal(15,2)"
    nullable: false
    description: "Annualized customer value"
    
  - name: "value_per_active_day"
    type: "decimal(10,2)"
    nullable: false
    description: "Average value per active day"
    
  - name: "churn_risk"
    type: "string"
    nullable: false
    description: "Churn risk level (Active, Low, Medium, High)"
    
  - name: "recommended_action"
    type: "string"
    nullable: false
    description: "Next best action recommendation"
    
  # Data quality flags
  - name: "profile_completeness"
    type: "string"
    nullable: false
    description: "Profile completeness level"
    
  - name: "has_email"
    type: "boolean"
    nullable: false
    description: "Whether customer has email address"
    
  - name: "has_phone"
    type: "boolean"
    nullable: false
    description: "Whether customer has phone number"
    
  - name: "has_transaction_history"
    type: "boolean"
    nullable: false
    description: "Whether customer has transaction history"
    
  # Audit fields
  - name: "snapshot_date"
    type: "date"
    nullable: false
    description: "Date of this snapshot"
    
  - name: "processed_at"
    type: "timestamp"
    nullable: false
    description: "Processing timestamp"
    
  - name: "model_version"
    type: "string"
    nullable: false
    description: "Customer 360 model version"

# Table Properties and Optimization
table_properties:
  "delta.enableChangeDataFeed": "true"
  "delta.autoOptimize.optimizeWrite": "true"
  "delta.autoOptimize.autoCompact": "true"
  "delta.deletedFileRetentionDuration": "interval 30 days"
  "delta.logRetentionDuration": "interval 90 days"

# Partitioning and Clustering Strategy
partitioning:
  partition_by: ["customer_segment", "value_tier"]
  cluster_by: ["loyalty_tier", "days_since_last_purchase"]
  z_order_by: ["customer_id", "lifetime_value", "engagement_score"]

# Data Quality Expectations
expectations:
  - name: "valid_customer_id"
    expression: "customer_id IS NOT NULL"
    action: "FAIL"
    tag: "validity"
    
  - name: "valid_metrics"
    expression: "total_transactions >= 0 AND lifetime_value >= 0"
    action: "FAIL"
    tag: "business_rule"
    
  - name: "valid_percentages"
    expression: "engagement_score BETWEEN 0 AND 100"
    action: "QUARANTINE"
    tag: "range_validation"
    
  - name: "valid_segments"
    expression: "customer_segment IN ('Champions', 'Loyal Customers', 'Potential Loyalists', 'New Customers', 'Promising', 'Need Attention', 'About to Sleep', 'Lost', 'Others')"
    action: "QUARANTINE"
    tag: "reference_data"

# Refresh Configuration
refresh:
  interval: "30 minutes"
  mode: "COMPLETE"  # Full refresh for comprehensive customer view
  
# Access Control
access_control:
  read_access: ["data_engineers", "data_analysts", "business_analysts", "customer_analytics_team", "marketing_team", "gold_pipeline_service"]
  write_access: ["gold_pipeline_service", "analytics_service"]
  admin_access: ["data_engineering_leads", "platform_admins"]

# Retention and Lifecycle
retention:
  raw_data_days: 1095  # 3 years for customer analytics
  vacuum_enabled: true
  vacuum_retention_hours: 168  # 7 days

# Business Context
business_context:
  primary_users: ["Marketing Teams", "Customer Success", "Sales Teams", "Executive Dashboards"]
  use_cases: 
    - "Customer segmentation and targeting"
    - "Churn prediction and retention campaigns"
    - "Personalized marketing and recommendations"
    - "Customer lifetime value optimization"
    - "Loyalty program optimization"
  
  key_metrics:
    - "Customer Lifetime Value (CLV)"
    - "Customer Acquisition Cost (CAC)"
    - "Churn Rate by Segment"
    - "Engagement Score Distribution"
    - "Revenue per Customer Segment"

# Lineage and Governance
lineage:
  upstream_sources: 
    - "silver_curated.customer_profiles_enriched"
    - "silver_curated.pos_transactions_cleansed"
    - "silver_curated.web_events_sessionized"
  downstream_systems:
    - "Customer Success Platform"
    - "Marketing Automation System"
    - "Executive Dashboards"
    - "Personalization Engine"
  business_purpose: "Comprehensive customer analytics for strategic decision making and operational optimization"
  data_domain: "customer_analytics"
  
# Tags for Governance
tags:
  environment: "production"
  layer: "gold"
  source_type: "analytics"
  data_domain: "customer"
  pii_data: "true"  # Contains customer identifiers and personal information
  compliance: "gdpr"
  retention_policy: "3_years"
  critical_business_data: "true"
  business_impact: "high"