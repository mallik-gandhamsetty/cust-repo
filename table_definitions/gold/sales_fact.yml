# Gold Layer - Sales Fact Daily Aggregations
# Daily sales metrics with multi-dimensional analysis and performance indicators
metadata:
  name: "gold_sales_fact_daily"
  description: "Daily sales analytics with store performance and trend analysis"
  layer: "gold"
  source_system: "silver_curated.pos_transactions_cleansed"
  data_classification: "sales_analytics_data"
  created_by: "nexa_platform"
  materialization: "MATERIALIZED_VIEW"
  
# Unity Catalog Configuration
unity_catalog:
  catalog: "workspace"
  schema: "gold_analytics"
  table_name: "sales_fact_daily"
  table_type: "MANAGED"
  
# Source Configuration
source:
  type: "materialized_view"
  source_tables: 
    - "silver_curated.pos_transactions_cleansed"
    - "silver_curated.product_catalog_standardized"
  refresh_interval: "15 minutes"
  
# Table Schema Definition (Key fields from transformation)
schema:
  # Date dimensions
  - name: "transaction_date"
    type: "date"
    nullable: false
    description: "Transaction date"
    
  - name: "transaction_year"
    type: "int"
    nullable: false
    description: "Transaction year"
    
  - name: "transaction_month"
    type: "int"
    nullable: false
    description: "Transaction month"
    
  - name: "transaction_day"
    type: "int"
    nullable: false
    description: "Transaction day of month"
    
  - name: "day_of_week_num"
    type: "int"
    nullable: false
    description: "Day of week number (1=Sunday)"
    
  - name: "day_of_week_name"
    type: "string"
    nullable: false
    description: "Day of week name"
    
  - name: "day_type"
    type: "string"
    nullable: false
    description: "Weekend or Weekday"
    
  - name: "week_of_year"
    type: "int"
    nullable: false
    description: "Week number of year"
    
  - name: "quarter"
    type: "int"
    nullable: false
    description: "Quarter of year"
    
  # Store identifier
  - name: "store_id"
    type: "string"
    nullable: false
    description: "Store identifier"
    
  # Core transaction metrics
  - name: "total_transactions"
    type: "int"
    nullable: false
    description: "Total number of transactions"
    
  - name: "unique_customers"
    type: "int"
    nullable: false
    description: "Number of unique customers"
    
  - name: "member_transactions"
    type: "int"
    nullable: false
    description: "Transactions by loyalty members"
    
  - name: "guest_transactions"
    type: "int"
    nullable: false
    description: "Transactions by guests"
    
  - name: "member_penetration_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of transactions by members"
    
  - name: "guest_penetration_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of transactions by guests"
    
  # Revenue metrics
  - name: "gross_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Total gross revenue"
    
  - name: "subtotal_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Revenue before tax"
    
  - name: "total_tax"
    type: "decimal(15,2)"
    nullable: false
    description: "Total tax collected"
    
  - name: "total_discounts"
    type: "decimal(15,2)"
    nullable: false
    description: "Total discounts applied"
    
  - name: "avg_transaction_value"
    type: "decimal(10,2)"
    nullable: false
    description: "Average transaction value"
    
  - name: "min_transaction_value"
    type: "decimal(10,2)"
    nullable: false
    description: "Minimum transaction value"
    
  - name: "max_transaction_value"
    type: "decimal(10,2)"
    nullable: false
    description: "Maximum transaction value"
    
  - name: "tax_rate_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Effective tax rate percentage"
    
  - name: "discount_rate_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Discount rate percentage"
    
  # Product metrics
  - name: "total_items_sold"
    type: "int"
    nullable: false
    description: "Total quantity of items sold"
    
  - name: "total_line_items"
    type: "int"
    nullable: false
    description: "Total number of line items"
    
  - name: "avg_items_per_transaction"
    type: "decimal(8,2)"
    nullable: false
    description: "Average items per transaction (UPT)"
    
  - name: "avg_line_items_per_transaction"
    type: "decimal(8,2)"
    nullable: false
    description: "Average line items per transaction"
    
  - name: "units_per_dollar"
    type: "decimal(8,4)"
    nullable: false
    description: "Units sold per revenue dollar"
    
  # Payment method analysis
  - name: "cash_transactions"
    type: "int"
    nullable: false
    description: "Number of cash transactions"
    
  - name: "credit_transactions"
    type: "int"
    nullable: false
    description: "Number of credit card transactions"
    
  - name: "debit_transactions"
    type: "int"
    nullable: false
    description: "Number of debit card transactions"
    
  - name: "mobile_transactions"
    type: "int"
    nullable: false
    description: "Number of mobile payment transactions"
    
  - name: "cash_transaction_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of cash transactions"
    
  - name: "credit_transaction_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of credit transactions"
    
  - name: "debit_transaction_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of debit transactions"
    
  - name: "mobile_transaction_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of mobile transactions"
    
  - name: "cash_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Revenue from cash payments"
    
  - name: "credit_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Revenue from credit payments"
    
  - name: "debit_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Revenue from debit payments"
    
  - name: "mobile_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Revenue from mobile payments"
    
  # Time of day analysis
  - name: "morning_transactions"
    type: "int"
    nullable: false
    description: "Morning transactions count"
    
  - name: "afternoon_transactions"
    type: "int"
    nullable: false
    description: "Afternoon transactions count"
    
  - name: "evening_transactions"
    type: "int"
    nullable: false
    description: "Evening transactions count"
    
  - name: "night_transactions"
    type: "int"
    nullable: false
    description: "Night transactions count"
    
  - name: "morning_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Revenue during morning hours"
    
  - name: "afternoon_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Revenue during afternoon hours"
    
  - name: "evening_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Revenue during evening hours"
    
  - name: "night_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Revenue during night hours"
    
  - name: "peak_revenue_period"
    type: "string"
    nullable: false
    description: "Time period with highest revenue"
    
  # Transaction size distribution
  - name: "small_transactions"
    type: "int"
    nullable: false
    description: "Small transaction count (<$10)"
    
  - name: "medium_transactions"
    type: "int"
    nullable: false
    description: "Medium transaction count ($10-$50)"
    
  - name: "large_transactions"
    type: "int"
    nullable: false
    description: "Large transaction count ($50-$200)"
    
  - name: "very_large_transactions"
    type: "int"
    nullable: false
    description: "Very large transaction count (>$200)"
    
  - name: "small_transaction_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of small transactions"
    
  - name: "medium_transaction_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of medium transactions"
    
  - name: "large_transaction_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of large transactions"
    
  - name: "very_large_transaction_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of very large transactions"
    
  # Promotional activity
  - name: "discounted_transactions"
    type: "int"
    nullable: false
    description: "Transactions with discounts"
    
  - name: "promoted_transactions"
    type: "int"
    nullable: false
    description: "Transactions with promotions"
    
  - name: "promotional_discounts"
    type: "decimal(15,2)"
    nullable: false
    description: "Total promotional discount amount"
    
  - name: "discount_penetration_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of discounted transactions"
    
  - name: "promotion_penetration_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage of promoted transactions"
    
  # Loyalty program metrics
  - name: "total_points_earned"
    type: "int"
    nullable: false
    description: "Total loyalty points earned"
    
  - name: "total_points_redeemed"
    type: "int"
    nullable: false
    description: "Total loyalty points redeemed"
    
  - name: "point_earning_transactions"
    type: "int"
    nullable: false
    description: "Transactions earning points"
    
  - name: "point_redemption_transactions"
    type: "int"
    nullable: false
    description: "Transactions redeeming points"
    
  - name: "point_earning_rate_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage earning points"
    
  - name: "point_redemption_rate_pct"
    type: "decimal(5,2)"
    nullable: false
    description: "Percentage redeeming points"
    
  # Operational metrics
  - name: "active_registers"
    type: "int"
    nullable: false
    description: "Number of active registers"
    
  - name: "active_cashiers"
    type: "int"
    nullable: false
    description: "Number of active cashiers"
    
  - name: "transactions_per_register"
    type: "decimal(8,2)"
    nullable: false
    description: "Average transactions per register"
    
  - name: "revenue_per_cashier"
    type: "decimal(10,2)"
    nullable: false
    description: "Average revenue per cashier"
    
  # Company comparison metrics
  - name: "company_total_transactions"
    type: "int"
    nullable: false
    description: "Company-wide total transactions"
    
  - name: "company_gross_revenue"
    type: "decimal(15,2)"
    nullable: false
    description: "Company-wide gross revenue"
    
  - name: "active_stores"
    type: "int"
    nullable: false
    description: "Total number of active stores"
    
  - name: "store_revenue_share_pct"
    type: "decimal(8,4)"
    nullable: false
    description: "Store's share of company revenue"
    
  - name: "store_transaction_share_pct"
    type: "decimal(8,4)"
    nullable: false
    description: "Store's share of company transactions"
    
  # Performance indicators
  - name: "atv_performance"
    type: "string"
    nullable: false
    description: "ATV performance vs company average"
    
  - name: "upt_performance"
    type: "string"
    nullable: false
    description: "UPT performance vs company average"
    
  # Data quality
  - name: "data_quality_flag"
    type: "string"
    nullable: false
    description: "Data quality assessment"
    
  # Audit fields
  - name: "processed_at"
    type: "timestamp"
    nullable: false
    description: "Processing timestamp"
    
  - name: "model_version"
    type: "string"
    nullable: false
    description: "Sales fact model version"

# Table Properties and Optimization
table_properties:
  "delta.enableChangeDataFeed": "true"
  "delta.autoOptimize.optimizeWrite": "true"
  "delta.autoOptimize.autoCompact": "true"
  "delta.deletedFileRetentionDuration": "interval 30 days"
  "delta.logRetentionDuration": "interval 90 days"

# Partitioning and Clustering Strategy
partitioning:
  partition_by: ["transaction_year", "transaction_month"]
  cluster_by: ["transaction_date", "store_id"]
  z_order_by: ["transaction_date", "gross_revenue", "total_transactions"]

# Data Quality Expectations
expectations:
  - name: "valid_date"
    expression: "transaction_date IS NOT NULL"
    action: "FAIL"
    tag: "validity"
    
  - name: "valid_metrics"
    expression: "total_transactions >= 0 AND gross_revenue >= 0"
    action: "FAIL"
    tag: "business_rule"
    
  - name: "valid_store_id"
    expression: "store_id IS NOT NULL"
    action: "FAIL"
    tag: "validity"
    
  - name: "consistent_totals"
    expression: "total_transactions = (member_transactions + guest_transactions)"
    action: "QUARANTINE"
    tag: "consistency"
    
  - name: "valid_percentages"
    expression: "member_penetration_pct BETWEEN 0 AND 100 AND guest_penetration_pct BETWEEN 0 AND 100"
    action: "QUARANTINE"
    tag: "range_validation"

# Refresh Configuration
refresh:
  interval: "15 minutes"
  mode: "INCREMENTAL"
  watermark_column: "transaction_date"
  
# Access Control
access_control:
  read_access: ["data_engineers", "data_analysts", "business_analysts", "store_managers", "regional_managers", "executives", "gold_pipeline_service"]
  write_access: ["gold_pipeline_service", "analytics_service"]
  admin_access: ["data_engineering_leads", "platform_admins"]

# Retention and Lifecycle
retention:
  raw_data_days: 2555  # 7 years for sales data
  vacuum_enabled: true
  vacuum_retention_hours: 168  # 7 days

# Business Context
business_context:
  primary_users: ["Store Operations", "Regional Management", "Executive Leadership", "Finance Teams"]
  use_cases: 
    - "Daily sales performance monitoring"
    - "Store performance comparison and benchmarking"
    - "Payment method trend analysis"
    - "Promotional effectiveness measurement"
    - "Operational efficiency optimization"
    - "Revenue forecasting and planning"
  
  key_metrics:
    - "Gross Revenue"
    - "Average Transaction Value (ATV)"
    - "Units Per Transaction (UPT)"
    - "Member Penetration Rate"
    - "Discount Penetration Rate"
    - "Revenue per Square Foot"

# Lineage and Governance
lineage:
  upstream_sources: 
    - "silver_curated.pos_transactions_cleansed"
    - "silver_curated.product_catalog_standardized"
  downstream_systems:
    - "Store Operations Dashboards"
    - "Executive Reporting"
    - "Financial Planning Systems"
    - "Performance Management Tools"
  business_purpose: "Daily sales analytics for operational and strategic decision making"
  data_domain: "sales_analytics"
  
# Tags for Governance
tags:
  environment: "production"
  layer: "gold"
  source_type: "analytics"
  data_domain: "sales"
  pii_data: "false"
  compliance: "sox"  # Sarbanes-Oxley for financial data
  retention_policy: "7_years"
  critical_business_data: "true"
  business_impact: "high"