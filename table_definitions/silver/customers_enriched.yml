# Silver Layer - Enriched Customer Profiles
# Customer master data with transaction history and behavioral analytics
metadata:
  name: "silver_customer_profiles_enriched"
  description: "Enriched customer profiles with RFM analysis and transaction history"
  layer: "silver"
  source_system: "bronze_batch.crm_customers"
  data_classification: "enriched_customer_data"
  created_by: "nexa_platform"
  materialization: "MATERIALIZED_VIEW"
  
# Unity Catalog Configuration
unity_catalog:
  catalog: "megamart_retail360_prod"
  schema: "silver_curated"
  table_name: "customer_profiles_enriched"
  table_type: "MANAGED"
  
# Source Configuration
source:
  type: "materialized_view"
  source_tables: 
    - "bronze_batch.crm_customers"
    - "silver_curated.pos_transactions_cleansed"
  refresh_interval: "30 minutes"
  
# Table Schema Definition (Key fields from transformation)
schema:
  - name: "customer_id"
    type: "string"
    nullable: false
    description: "Unique customer identifier"
    
  - name: "full_name"
    type: "string"
    nullable: true
    description: "Customer full name (standardized)"
    
  - name: "email_clean"
    type: "string"
    nullable: true
    description: "Cleaned and standardized email address"
    
  - name: "phone_standardized"
    type: "string"
    nullable: true
    description: "Standardized phone number with country code"
    
  - name: "city"
    type: "string"
    nullable: true
    description: "Customer city (standardized)"
    
  - name: "state_province"
    type: "string"
    nullable: true
    description: "Customer state or province (standardized)"
    
  - name: "country_code"
    type: "string"
    nullable: true
    description: "Country code (standardized)"
    
  - name: "age_years"
    type: "int"
    nullable: true
    description: "Customer age in years"
    
  - name: "age_group"
    type: "string"
    nullable: false
    description: "Age group classification"
    
  - name: "gender_standardized"
    type: "string"
    nullable: false
    description: "Gender (M, F, O, Unknown)"
    
  - name: "registration_date"
    type: "date"
    nullable: true
    description: "Customer registration date"
    
  - name: "registration_year"
    type: "int"
    nullable: true
    description: "Registration year for partitioning"
    
  - name: "customer_tenure_days"
    type: "int"
    nullable: true
    description: "Days since registration"
    
  - name: "is_active"
    type: "boolean"
    nullable: false
    description: "Whether customer is active"
    
  - name: "loyalty_tier"
    type: "string"
    nullable: false
    description: "Customer loyalty tier"
    
  - name: "loyalty_points_balance"
    type: "int"
    nullable: false
    description: "Current loyalty points balance"
    
  - name: "total_transactions"
    type: "int"
    nullable: false
    description: "Total number of transactions"
    
  - name: "lifetime_value"
    type: "decimal(15,2)"
    nullable: false
    description: "Customer lifetime value"
    
  - name: "average_transaction_value"
    type: "decimal(10,2)"
    nullable: false
    description: "Average transaction value"
    
  - name: "last_transaction_date"
    type: "date"
    nullable: true
    description: "Date of most recent transaction"
    
  - name: "days_since_last_purchase"
    type: "int"
    nullable: false
    description: "Days since last purchase (recency)"
    
  - name: "purchase_frequency_90d"
    type: "int"
    nullable: false
    description: "Number of purchases in last 90 days"
    
  - name: "monetary_value_90d"
    type: "decimal(15,2)"
    nullable: false
    description: "Total spend in last 90 days"
    
  - name: "customer_segment"
    type: "string"
    nullable: false
    description: "RFM-based customer segment"
    
  - name: "value_tier"
    type: "string"
    nullable: false
    description: "Customer value tier classification"
    
  - name: "engagement_score"
    type: "int"
    nullable: false
    description: "Customer engagement score (0-100)"
    
  - name: "profile_completeness"
    type: "string"
    nullable: false
    description: "Profile completeness level"
    
  - name: "processed_at"
    type: "timestamp"
    nullable: false
    description: "Silver layer processing timestamp"

# Table Properties and Optimization
table_properties:
  "delta.enableChangeDataFeed": "true"
  "delta.autoOptimize.optimizeWrite": "true"
  "delta.autoOptimize.autoCompact": "true"
  "delta.deletedFileRetentionDuration": "interval 30 days"
  "delta.logRetentionDuration": "interval 90 days"

# Partitioning and Clustering Strategy
partitioning:
  partition_by: ["customer_segment", "registration_year"]
  cluster_by: ["loyalty_tier", "is_active"]
  z_order_by: ["customer_id", "lifetime_value"]

# Data Quality Expectations
expectations:
  - name: "valid_customer_id"
    expression: "customer_id IS NOT NULL"
    action: "FAIL"
    tag: "validity"
    
  - name: "valid_email_format"
    expression: "email_clean RLIKE '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$' OR email_clean IS NULL"
    action: "QUARANTINE"
    tag: "format_validation"
    
  - name: "valid_phone_format"
    expression: "phone_standardized RLIKE '^\\+?[0-9]{10,15}$' OR phone_standardized IS NULL"
    action: "QUARANTINE"
    tag: "format_validation"
    
  - name: "valid_birth_date"
    expression: "age_years IS NULL OR (age_years >= 13 AND age_years <= 120)"
    action: "QUARANTINE"
    tag: "business_rule"
    
  - name: "valid_metrics"
    expression: "total_transactions >= 0 AND lifetime_value >= 0"
    action: "FAIL"
    tag: "business_rule"

# Refresh Configuration
refresh:
  interval: "30 minutes"
  mode: "INCREMENTAL"
  watermark_column: "profile_modified_date"
  
# Access Control
access_control:
  read_access: ["data_engineers", "data_analysts", "business_analysts", "customer_analytics_team", "silver_pipeline_service"]
  write_access: ["silver_pipeline_service", "transformation_service"]
  admin_access: ["data_engineering_leads", "platform_admins"]

# Retention and Lifecycle
retention:
  raw_data_days: 1095  # 3 years for customer data
  vacuum_enabled: true
  vacuum_retention_hours: 168  # 7 days

# Lineage and Governance
lineage:
  upstream_sources: ["bronze_batch.crm_customers", "silver_curated.pos_transactions_cleansed"]
  downstream_tables: ["gold_analytics.customer_360"]
  business_purpose: "Enriched customer profiles with behavioral analytics for segmentation and personalization"
  data_domain: "customer_master"
  
# Tags for Governance
tags:
  environment: "production"
  layer: "silver"
  source_type: "batch"
  data_domain: "customer"
  pii_data: "true"  # Contains customer identifiers and personal information
  compliance: "gdpr"
  retention_policy: "3_years"
  critical_business_data: "true"