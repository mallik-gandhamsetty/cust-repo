# MegaMart Retail 360 - Main Data Pipeline Orchestration
# Generated by Nexa Platform - DO NOT EDIT MANUALLY
# All changes should be made through the Nexa UI

metadata:
  name: "megamart_retail360_main_pipeline"
  description: "End-to-end data pipeline orchestrating Bronze → Silver → Gold layers for MegaMart Retail 360"
  version: "1.0.0"
  generated_by: "nexa_platform"
  generated_at: "2024-08-14T00:00:00Z"
  business_owner: "retail_data_platform_team"
  technical_owner: "data_engineering_team"

# Global Configuration
global_config:
  project_name: "megamart_retail360"
  environments:
    development:
      catalog: "megamart_retail360_dev"
      storage_location: "s3://megamart-data-lake-dev"
      cluster_policy: "development_policy"
    test:
      catalog: "megamart_retail360_test"  
      storage_location: "s3://megamart-data-lake-test"
      cluster_policy: "test_policy"
    production:
      catalog: "megamart_retail360_prod"
      storage_location: "s3://megamart-data-lake-prod"
      cluster_policy: "production_policy"

  # Default configurations applied to all pipelines
  defaults:
    photon_enabled: true
    serverless: false
    edition: "ADVANCED"
    enable_change_data_feed: true
    auto_optimize: true
    vacuum_enabled: true
    retention_days: 30

# Pipeline Execution Order and Dependencies
execution_graph:
  # Layer 1: Bronze Ingestion (Parallel execution)
  bronze_layer:
    pipelines:
      - name: "bronze_streaming_pipeline"
        type: "streaming"
        description: "Real-time ingestion from Kafka sources"
        depends_on: []
        parallel: true
        
      - name: "bronze_batch_pipeline"
        type: "batch"
        description: "Batch ingestion from cloud storage sources"
        depends_on: []
        parallel: true

  # Layer 2: Silver Transformation (Depends on Bronze completion)  
  silver_layer:
    pipelines:
      - name: "silver_transformation_pipeline"
        type: "mixed"  # Both streaming and batch
        description: "Data cleansing, enrichment, and JSON flattening"
        depends_on: ["bronze_streaming_pipeline", "bronze_batch_pipeline"]
        parallel: false
        
  # Layer 3: Gold Analytics (Depends on Silver completion)
  gold_layer:
    pipelines:
      - name: "gold_analytics_pipeline"
        type: "batch"
        description: "Business analytics and aggregations"
        depends_on: ["silver_transformation_pipeline"] 
        parallel: false

# Pipeline Definitions
pipelines:
  
  # BRONZE STREAMING PIPELINE
  bronze_streaming_pipeline:
    pipeline_config:
      name: "MegaMart Bronze Streaming Ingestion"
      target: "bronze_streaming"
      continuous: true
      development: false
      edition: "ADVANCED"
      photon: true
      serverless: false
      
      clusters:
        - label: "streaming_cluster"
          autoscale:
            min_workers: 2
            max_workers: 8
            mode: "ENHANCED"
          node_type_id: "i3.xlarge"
          
      libraries:
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/bronze/kafka_pos_transactions"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/bronze/kafka_customer_events"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/bronze/kafka_inventory_movements"
            
      configuration:
        "pipelines.trigger.interval": "5 seconds"
        "pipelines.maxFilesPerTrigger": "1000"
        
    sources:
      - name: "kafka_pos_transactions"
        type: "kafka"
        topic: "pos-transactions-v1"
        format: "json"
        
      - name: "kafka_customer_events"
        type: "kafka"
        topic: "customer-events-v1"  
        format: "json"
        
      - name: "kafka_inventory_movements"
        type: "kafka"
        topic: "inventory-movements-v1"
        format: "json"

  # BRONZE BATCH PIPELINE
  bronze_batch_pipeline:
    pipeline_config:
      name: "MegaMart Bronze Batch Ingestion"
      target: "bronze_batch"
      continuous: false
      development: false
      edition: "ADVANCED"
      photon: true
      serverless: false
      
      clusters:
        - label: "batch_cluster"
          autoscale:
            min_workers: 1
            max_workers: 4
            mode: "ENHANCED"
          node_type_id: "i3.large"
          
      libraries:
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/bronze/cloudfiles_product_catalog"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/bronze/cloudfiles_web_analytics"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/bronze/cloudfiles_social_media"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/bronze/cloudfiles_crm_customers"
            
      configuration:
        "pipelines.trigger.interval": "30 minutes"
        "pipelines.maxFilesPerTrigger": "100"
        
    sources:
      - name: "cloudfiles_product_catalog"
        type: "cloudfiles"
        location: "s3://megamart-data-lake-prod/raw/product_catalog/"
        format: "json"
        
      - name: "cloudfiles_web_analytics"
        type: "cloudfiles"
        location: "s3://megamart-data-lake-prod/raw/web_analytics/"
        format: "parquet"
        
      - name: "cloudfiles_social_media"
        type: "cloudfiles"
        location: "s3://megamart-data-lake-prod/raw/social_media/"
        format: "json"
        
      - name: "cloudfiles_crm_customers"
        type: "cloudfiles"
        location: "s3://megamart-data-lake-prod/raw/crm_customers/"
        format: "delta"

  # SILVER TRANSFORMATION PIPELINE
  silver_transformation_pipeline:
    pipeline_config:
      name: "MegaMart Silver Data Transformation"
      target: "silver_curated"
      continuous: true  # Mixed mode: streaming for real-time, batch for daily aggregates
      development: false
      edition: "ADVANCED"  
      photon: true
      serverless: false
      
      clusters:
        - label: "transformation_cluster"
          autoscale:
            min_workers: 3
            max_workers: 12
            mode: "ENHANCED"
          node_type_id: "i3.xlarge"
          
      libraries:
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/silver/pos_transactions_cleansed"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/silver/customer_profiles_enriched"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/silver/product_catalog_standardized"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/silver/inventory_movements_processed"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/silver/web_events_sessionized"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/silver/social_media_sentiment"
            
      configuration:
        "pipelines.trigger.interval": "1 minute"
        
    transformations:
      - name: "pos_transactions_cleansed"
        type: "streaming_table"
        source: "bronze_streaming.pos_transactions"
        
      - name: "customer_profiles_enriched" 
        type: "materialized_view"
        source: "bronze_batch.crm_customers"
        
      - name: "product_catalog_standardized"
        type: "materialized_view"
        source: "bronze_batch.product_catalog"
        refresh_interval: "1 hour"
        
      - name: "inventory_movements_processed"
        type: "streaming_table"
        source: "bronze_streaming.inventory_movements"
        
      - name: "web_events_sessionized"
        type: "streaming_table"  
        source: "bronze_batch.web_analytics"
        
      - name: "social_media_sentiment"
        type: "streaming_table"
        source: "bronze_batch.social_media"

  # GOLD ANALYTICS PIPELINE
  gold_analytics_pipeline:
    pipeline_config:
      name: "MegaMart Gold Business Analytics"
      target: "gold_analytics"
      continuous: false
      development: false
      edition: "ADVANCED"
      photon: true
      serverless: false
      
      clusters:
        - label: "analytics_cluster"
          autoscale:
            min_workers: 2
            max_workers: 8  
            mode: "ENHANCED"
          node_type_id: "i3.xlarge"
          
      libraries:
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/gold/customer_360"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/gold/sales_fact_daily"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/gold/product_performance"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/gold/inventory_analytics"
        - notebook:
            path: "/Workspace/megamart_retail360/transformations/gold/customer_behavior_metrics"
            
      configuration:
        "pipelines.trigger.interval": "1 hour"
        
    transformations:
      - name: "customer_360"
        type: "materialized_view"
        sources: 
          - "silver_curated.customer_profiles_enriched"
          - "silver_curated.pos_transactions_cleansed"
          - "silver_curated.web_events_sessionized"
        refresh_interval: "30 minutes"
        
      - name: "sales_fact_daily"
        type: "materialized_view"
        sources:
          - "silver_curated.pos_transactions_cleansed"
          - "silver_curated.product_catalog_standardized"
        refresh_interval: "15 minutes"
        
      - name: "product_performance"
        type: "materialized_view"  
        sources:
          - "silver_curated.pos_transactions_cleansed"
          - "silver_curated.inventory_movements_processed"
          - "silver_curated.product_catalog_standardized"
        refresh_interval: "1 hour"
        
      - name: "inventory_analytics"
        type: "materialized_view"
        sources:
          - "silver_curated.inventory_movements_processed"
          - "silver_curated.product_catalog_standardized" 
        refresh_interval: "30 minutes"
        
      - name: "customer_behavior_metrics"
        type: "materialized_view"
        sources:
          - "gold_analytics.customer_360"
          - "silver_curated.web_events_sessionized"
          - "silver_curated.social_media_sentiment"
        refresh_interval: "2 hours"

# Scheduling Configuration
scheduling:
  # Bronze pipelines run continuously for real-time ingestion
  bronze_streaming_pipeline:
    type: "continuous"
    
  bronze_batch_pipeline:
    type: "scheduled"
    cron: "0 */30 * * * ?"  # Every 30 minutes
    
  # Silver runs in near real-time
  silver_transformation_pipeline:
    type: "continuous"
    
  # Gold runs on schedule for analytics
  gold_analytics_pipeline:
    type: "scheduled"
    cron: "0 0 */1 * * ?"  # Every hour

# Monitoring and Alerting
monitoring:
  enabled: true
  
  # Pipeline health monitoring
  health_checks:
    - pipeline_success_rate: 0.95
    - data_freshness_minutes: 60
    - processing_lag_minutes: 15
    
  # Alerts configuration  
  alerts:
    email_recipients: ["data-engineering@megamart.com", "retail-analytics@megamart.com"]
    slack_webhook: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"
    
    conditions:
      - name: "pipeline_failure"
        threshold: 1  # Alert on any failure
        severity: "high"
        
      - name: "data_quality_degradation"
        threshold: 0.05  # 5% quality score drop
        severity: "medium"
        
      - name: "processing_delay"
        threshold: 30  # 30 minutes delay
        severity: "medium"

# Cost Management
cost_management:
  auto_terminate_idle_minutes: 30
  
  budget_alerts:
    daily_threshold_usd: 500
    monthly_threshold_usd: 15000
    
  optimization:
    spot_instances: false  # Production workload
    photon_enabled: true   # Better performance per dollar
    auto_scaling_enabled: true

# Security and Access Control
security:
  service_principals:
    bronze: "megamart-bronze-sp"
    silver: "megamart-silver-sp" 
    gold: "megamart-gold-sp"
    
  permissions:
    - principal: "data-engineers"
      permission: "CAN_MANAGE"
      scope: "all_pipelines"
      
    - principal: "data-analysts" 
      permission: "CAN_VIEW"
      scope: "silver_and_gold"
      
    - principal: "business-analysts"
      permission: "CAN_VIEW"
      scope: "gold_only"
      
    - principal: "megamart-etl-service"
      permission: "CAN_RUN"
      scope: "all_pipelines"

# Data Lineage and Governance
governance:
  data_lineage_tracking: true
  
  business_glossary:
    - term: "POS Transactions"
      definition: "Point-of-sale transaction records from retail stores"
      data_domain: "sales"
      
    - term: "Customer 360"
      definition: "Unified customer profile combining all touchpoints"
      data_domain: "customer"
      
    - term: "Inventory Movements"
      definition: "Stock level changes across all locations"
      data_domain: "operations"
      
  compliance:
    gdpr_applicable: true
    data_retention_days: 2555  # 7 years
    pii_data_encrypted: true
    
# Tags for Organization
tags:
  project: "megamart_retail360"
  environment: "production" 
  cost_center: "data_platform"
  business_critical: "true"
  data_classification: "business_confidential"
  backup_required: "true"
  generated_by: "nexa_platform"